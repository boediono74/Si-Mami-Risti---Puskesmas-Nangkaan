<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#025a38" />
      <stop offset="50%" stop-color="#0a8853" />
      <stop offset="100%" stop-color="#04633b" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff75a0" />
      <stop offset="100%" stop-color="#e91e63" />
    </linearGradient>
    <linearGradient id="greenBannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#076a42" />
      <stop offset="100%" stop-color="#0b8152" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="236" fill="#ffffff" stroke="url(#circleGrad)" stroke-width="15" />

  <!-- Inner Soft Green/White Background -->
  <circle cx="250" cy="250" r="226" fill="#f8fdfa" />

  <!-- Background Smartphone Illustration on Left -->
  <g transform="translate(85, 80) rotate(-10)">
    <rect x="0" y="0" width="115" height="175" rx="20" fill="#e2f5ee" stroke="#007953" stroke-width="6" />
    <rect x="8" y="14" width="99" height="147" rx="14" fill="#ffffff" />
    <!-- Screen Icon: Mother & Child Silhouette -->
    <circle cx="57" cy="62" r="16" fill="#007953" />
    <path d="M 28 112 A 28 28 0 0 1 86 112 Z" fill="#007953" />
    <path d="M 57 95 C 57 90, 52 86, 48 88 C 44 90, 44 95, 48 98 L 57 107 L 66 98 C 70 95, 70 90, 66 88 C 62 86, 57 90, 57 95 Z" fill="#ffffff" />
  </g>

  <!-- Background Heart with Heartbeat on Right -->
  <g transform="translate(260, 60)">
    <!-- Heart Outline / Swirl -->
    <path d="M 100 90 C 100 40, 160 40, 175 75 C 190 40, 250 40, 250 90 C 250 150, 175 190, 175 220 C 175 190, 100 150, 100 90 Z" 
          fill="none" stroke="#e91e63" stroke-width="12" stroke-linecap="round" opacity="0.4" />
    
    <!-- Solid Heart -->
    <path d="M 60 70 C 60 45, 90 45, 100 65 C 110 45, 140 45, 140 70 C 140 100, 100 125, 100 135 C 100 125, 60 100, 60 70 Z" 
          fill="url(#pinkGrad)" filter="url(#shadow)" />
    <!-- Pulse Line -->
    <path d="M 70 75 L 85 75 L 92 60 L 98 90 L 105 70 L 112 80 L 130 80" 
          fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Center Figure: Pregnant Mother with Hijab -->
  <g id="pregnantMother" transform="translate(160, 65)">
    <!-- Body & Maternity Dress -->
    <path d="M 45 130 Q 30 180, 20 220 L 150 220 Q 140 180, 130 130 Z" fill="#d81b60" />
    <!-- Big Pregnant Belly -->
    <path d="M 30 145 C 5 185, 30 225, 110 225 C 135 225, 145 190, 130 150 Z" fill="#e91e63" />
    <!-- Shading on Belly -->
    <path d="M 40 155 C 20 185, 45 215, 105 215 C 80 215, 45 190, 50 160 Z" fill="#c2185b" opacity="0.3" />
    <!-- Hands gently cradling the belly -->
    <path d="M 85 160 C 105 165, 120 180, 105 195 C 90 205, 75 195, 70 180 Z" fill="#f8bbd0" />
    <path d="M 68 185 C 80 192, 100 192, 108 185 C 115 195, 95 208, 80 208 C 65 208, 60 195, 68 185 Z" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5" />

    <!-- Face & Neck -->
    <path d="M 75 80 Q 95 85, 100 115 Q 85 125, 70 120 Z" fill="#ffdfd3" />
    <!-- Gentle Eye & Eyelash -->
    <path d="M 88 95 Q 93 98, 97 94" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" />
    <!-- Smile -->
    <path d="M 92 107 Q 96 109, 99 105" fill="none" stroke="#d81b60" stroke-width="2" stroke-linecap="round" />
    
    <!-- Hijab (Pink / Magenta Flowing) -->
    <path d="M 50 85 C 45 40, 115 35, 125 75 C 135 110, 120 145, 115 170 C 105 180, 95 180, 85 170 C 75 155, 60 150, 45 130 C 40 115, 52 95, 50 85 Z" 
          fill="#f06292" />
    <!-- Inner Hijab Framing Face -->
    <path d="M 68 78 C 65 65, 110 60, 115 78 C 118 95, 110 115, 105 125 C 95 135, 80 135, 70 125 C 65 115, 68 85, 68 78 Z" 
          fill="#ec407a" />
  </g>

  <!-- Main Title: Si Mami (Green) Risti (Pink) -->
  <g transform="translate(250, 298)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
      <tspan fill="#005a36" x="-62">Si Mami </tspan>
      <tspan fill="#d81b60" x="66">Risti</tspan>
    </text>
    <!-- Heart above 'i' in Risti -->
    <path d="M 112 258 C 112 253, 108 249, 104 251 C 100 253, 100 258, 104 261 L 112 269 L 120 261 C 124 258, 124 253, 120 251 C 116 249, 112 253, 112 258 Z" 
          fill="#d81b60" />
  </g>

  <!-- Green Pill Banner: "Aplikasi Pemantauan Ibu Hamil / —— Resiko Tinggi ——" -->
  <g transform="translate(250, 336)">
    <!-- Pill Background -->
    <rect x="-175" y="-20" width="350" height="42" rx="21" fill="url(#greenBannerGrad)" />
    <!-- Subtitle Text Line 1 -->
    <text x="0" y="-3" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="14.5" letter-spacing="0.2">
      Aplikasi Pemantauan Ibu Hamil
    </text>
    <!-- Subtitle Text Line 2 with Flanking Lines -->
    <line x1="-120" y1="12" x2="-62" y2="12" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <text x="0" y="15.5" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5">
      Resiko Tinggi
    </text>
    <line x1="62" y1="12" x2="120" y2="12" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Puskesmas & District Caption -->
  <g transform="translate(250, 396)" text-anchor="middle">
    <text y="0" fill="#004d2c" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="15" letter-spacing="0.4">
      UPTD Puskesmas Nangkaan
    </text>
    <text y="19" fill="#004d2c" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="13.5" letter-spacing="0.4">
      Kabupaten Bondowoso
    </text>
  </g>

  <!-- Puskesmas Official Emblem (Green Hexagon with Cross at Bottom) -->
  <g transform="translate(250, 442)">
    <!-- Line on Left -->
    <line x1="-60" y1="0" x2="-22" y2="0" stroke="#007953" stroke-width="2" stroke-linecap="round" />
    <!-- Line on Right -->
    <line x1="22" y1="0" x2="60" y2="0" stroke="#007953" stroke-width="2" stroke-linecap="round" />

    <!-- Hexagon -->
    <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="#007953" stroke="#004d2c" stroke-width="1" />
    <!-- Inner White Cross -->
    <rect x="-2.5" y="-9" width="5" height="18" fill="#ffffff" />
    <rect x="-9" y="-2.5" width="18" height="5" fill="#ffffff" />
    <circle cx="0" cy="0" r="2.2" fill="#007953" />
  </g>
</svg>
